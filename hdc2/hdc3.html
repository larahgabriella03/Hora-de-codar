<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Maior de 3 Valores</title>
</head>
<body>
  <h2>Informe 3 valores diferentes:</h2>

  <form>
    <label>Valor 1: <input type="number" id="v1" required></label><br><br>
    <label>Valor 2: <input type="number" id="v2" required></label><br><br>
    <label>Valor 3: <input type="number" id="v3" required></label><br><br>
    <button type="button" onclick="mostrarMaior()">Enviar</button>
  </form>

  <h3>Resultado:</h3>
  <p id="resultado"></p>

  <script>
    function mostrarMaior() {

      var v1 = Number(document.getElementById("v1").value);
      var v2 = Number(document.getElementById("v2").value);
      var v3 = Number(document.getElementById("v3").value);

      var maior = Math.max(v1, v2, v3);

      document.getElementById("resultado").innerText =
        "O maior valor informado foi: " + maior;
    }
  </script>
</body>
</html>
