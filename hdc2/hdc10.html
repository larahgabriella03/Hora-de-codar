<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Peso Ideal</title>
</head>
<body>
  <h2>Calcule seu peso ideal</h2>

  <form>
    <label>Altura (em metros): <input type="number" step="0.01" id="altura"></label><br><br>
    <label>Gênero (1 = feminino, 2 = masculino): <input type="number" id="genero"></label><br><br>
    <button type="button" onclick="calcular()">Enviar</button>
  </form>

  <h3>Resultado:</h3>
  <p id="resultado"></p>

  <script>
    function calcular() {

      var altura = Number(document.getElementById("altura").value);
      var genero = Number(document.getElementById("genero").value);

      var pesoIdeal;

      if (genero === 1) {
        pesoIdeal = (62.1 * altura) - 44.7;
        document.getElementById("resultado").innerText =
          "Peso ideal (feminino): " + pesoIdeal.toFixed(2) + " kg";
      } else if (genero === 2) {
        pesoIdeal = (72.7 * altura) - 58;
        document.getElementById("resultado").innerText =
          "Peso ideal (masculino): " + pesoIdeal.toFixed(2) + " kg";
      } else {
        document.getElementById("resultado").innerText =
          "Código inválido. Use 1 para feminino ou 2 para masculino.";
      }
    }
  </script>
</body>
</html>
