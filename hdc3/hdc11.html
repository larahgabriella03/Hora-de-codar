<!DOCTYPE html>
<html>
<head>
    <title>Tabuadas de 1 até N</title>
</head>
<body>
    <h2>Digite um valor N</h2>

    <input type="number" id="valorN" min="1">
    <button onclick="tabuadas()">Mostrar Tabuadas</button>

    <div id="resultado"></div>

    <script>
        function tabuadas() {
            var N = parseInt(document.getElementById("valorN").value);
            var texto = "";

            for (var i = 1; i <= N; i++) {
                texto += "<h3>Tabuada do " + i + "</h3>";
                for (var j = 1; j <= 10; j++) {
                    texto += i + " x " + j + " = " + (i * j) + "<br>";
                }
                texto += "<br>";
            }

            document.getElementById("resultado").innerHTML = texto;
        }
    </script>
</body>
</html>
