<!DOCTYPE html>
<html>
<head>
    <title>10 números maiores que 100</title>
</head>
<body>
    <h2>Os 10 primeiros números inteiros maiores que 100</h2>
    <p id="resultado"></p>

    <script>
        var texto = "";

        for (var i = 101; i <= 110; i++) {
            texto += i + " ";
        }

        document.getElementById("resultado").innerHTML = texto;
    </script>
</body>
</html>
