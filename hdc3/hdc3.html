<!DOCTYPE html>
<html>
<head>
    <title>Contagem Decrescente</title>
</head>
<body>
    <h2>Números de 10 a 1</h2>
    <p id="resultado"></p>

    <script>
        var texto = "";

        for (var i = 10; i >= 1; i--) {
            texto += i + " ";
        }

        document.getElementById("resultado").innerHTML = texto;
    </script>
</body>
</html>
